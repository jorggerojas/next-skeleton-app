name: Playwright Tests
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/playwright.yml"
      - "src/**"
      - "e2e/**"
      - "playwright.config.*"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/playwright.yml"
      - "src/**"
      - "e2e/**"
      - "playwright.config.*"
      - "package.json"
      - "bun.lock"
jobs:
  run-playwright-e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-frozen-lockfile
      - name: Run linter
        run: bun run lint:ci
      - name: Build Next.js
        run: bun run build
      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> $GITHUB_OUTPUT
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Chromium and deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: bun run test:e2e -- --project=chromium
        env:
          CI: true
